<title>Flyer & Visitenkarte | Webdesign Salzgitter</title>
<!--
  Druckvorlagen. Ansicht wählen über die Adresse:
    flyer.html#a6        = 1 Flyer A6 (für Druckerei)
    flyer.html#a4-flyer  = 4 Flyer A6 auf A4 (zum Selberdrucken, an den Linien schneiden)
    flyer.html#karte     = Visitenkarte 85 × 55 mm, Seite 1 vorne, Seite 2 hinten (für Druckerei)
    flyer.html#a4-karten = 10 Visitenkarten auf A4 (vorne), Seite 2 = Rückseiten
  Texte ändern und Claude bitten: "Flyer neu erzeugen".
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #666; }
  .tpl { display: none; }
  .sheet { background: #fff; position: relative; overflow: hidden; break-after: page; margin: 0 auto 10mm; }
  .sheet:last-child { break-after: auto; }
  .lime { color: #d4ff3a; }

  /* ---------- Flyer A6 ---------- */
  .flyer { width: 105mm; height: 148mm; background:
      radial-gradient(60mm 45mm at 90% 18%, rgba(212,255,58,.16), transparent 70%),
      linear-gradient(rgba(255,255,255,.045) .2mm, transparent .2mm) 0 0 / 6mm 6mm,
      linear-gradient(90deg, rgba(255,255,255,.045) .2mm, transparent .2mm) 0 0 / 6mm 6mm, #0b0b0c;
    color: #f5f5f2; padding: 8mm 8mm 7mm; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .flyer .eyebrow { font-size: 2.5mm; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #d4ff3a; }
  .flyer h1 { font-size: 15.5mm; line-height: .92; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; margin-top: 4mm; }
  .flyer .sub { font-size: 3.6mm; color: #b5b5ae; margin-top: 3mm; line-height: 1.35; }
  .flyer ul { list-style: none; padding: 0; margin-top: 5mm; display: grid; gap: 1.8mm; }
  .flyer li { font-size: 3.6mm; font-weight: 700; padding-left: 5.5mm; position: relative; }
  .flyer li::before { content: "✓"; position: absolute; left: 0; color: #d4ff3a; font-weight: 900; }
  .flyer .sticker { position: absolute; right: 6mm; top: 30mm; width: 21mm; height: 21mm; border-radius: 50%; background: #d4ff3a; color: #0b0b0c; border: .6mm solid #0b0b0c; box-shadow: .9mm .9mm 0 #000; transform: rotate(10deg); display: grid; place-items: center; text-align: center; font-weight: 900; text-transform: uppercase; font-size: 2.6mm; line-height: 1; }
  .flyer .sticker b { display: block; font-size: 6.5mm; letter-spacing: -.04em; }
  .flyer .spacer { flex: 1; }
  .flyer .qrrow { display: flex; gap: 4mm; align-items: center; }
  .qrbox { background: #fff; padding: 3mm; border-radius: 1.5mm; flex: none; line-height: 0; }
  .flyer .qrbox { width: 27mm; height: 27mm; }
  .qrbox svg { width: 100%; height: 100%; display: block; }
  .qrbox svg path { fill: #000; }
  .flyer .qrtext b { display: block; font-size: 4mm; text-transform: uppercase; font-weight: 900; letter-spacing: -.01em; line-height: 1.1; }
  .flyer .qrtext span { font-size: 3mm; color: #b5b5ae; }
  .flyer .foot { border-top: .3mm solid #2c2c31; margin-top: 5mm; padding-top: 3mm; font-size: 2.7mm; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 2mm; flex-wrap: wrap; }

  /* ---------- Visitenkarte 85 × 55 ---------- */
  .card { width: 85mm; height: 55mm; overflow: hidden; position: relative; }
  .card-front { background: #0b0b0c; color: #f5f5f2; padding: 6mm; display: flex; flex-direction: column; }
  .card-front .brand { display: flex; align-items: center; gap: 2.5mm; font-weight: 900; text-transform: uppercase; font-size: 3.4mm; letter-spacing: .02em; }
  .card-front .brand svg { width: 7mm; height: 7mm; }
  .card-front h2 { margin-top: auto; font-size: 9.5mm; line-height: .92; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; }
  .card-front p { margin-top: 2mm; font-size: 2.7mm; color: #b5b5ae; font-weight: 600; }
  .card-back { background: #d4ff3a; color: #0b0b0c; padding: 5.5mm 6mm; display: flex; gap: 4.5mm; align-items: center; }
  .card-back .qrbox { width: 25mm; height: 25mm; border: .4mm solid #0b0b0c; }
  .card-back .info { display: grid; gap: 1.2mm; font-size: 2.3mm; font-weight: 700; min-width: 0; white-space: nowrap; letter-spacing: -.01em; }
  .card-back .info .t { font-size: 3.6mm; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; line-height: 1.05; margin-bottom: 1mm; }
  .card-back .info .tag { display: inline-block; background: #0b0b0c; color: #d4ff3a; font-weight: 900; text-transform: uppercase; font-size: 2.3mm; padding: .8mm 1.6mm; border-radius: .8mm; margin-top: 1mm; justify-self: start; }

  /* ---------- A4-Bögen mit Schnittlinien ---------- */
  .a4 { width: 210mm; height: 297mm; display: grid; place-content: center; }
  .grid-flyer { display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148mm 148mm; }
  .grid-karten { display: grid; grid-template-columns: 85mm 85mm; grid-auto-rows: 55mm; gap: 0; }
  .cut > * { outline: .15mm dashed #9a9a9a; outline-offset: -.075mm; }
</style>
