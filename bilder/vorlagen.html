<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Bild-Vorlagen | Webdesign Salzgitter</title>
<!-- Vorlagen für og-image.png (Link-Vorschau, 1200 × 630) und apple-touch-icon.png (180 × 180).
     Text hier ändern und Claude bitten: "Bilder neu rendern". -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #333; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #og { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #f5f5f2; padding: 64px 72px; display: flex; flex-direction: column;
    background: radial-gradient(600px 420px at 88% 25%, rgba(212,255,58,.16), transparent 70%),
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 48px 48px, #0b0b0c; }
  .eyebrow { font-size: 24px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #d4ff3a; }
  .eyebrow::before { content: "// "; opacity: .6; }
  h1 { margin: 22px 0 0; font-size: 128px; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; line-height: .92; }
  .hl { color: #d4ff3a; }
  .sub { font-size: 30px; color: #a9a9a3; margin-top: 26px; }
  .spacer { flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; border-top: 3px solid #2c2c31; padding-top: 24px; }
  .foot .logo { display: flex; gap: 14px; align-items: center; }
  .foot svg { width: 46px; height: 46px; }
  .url { color: #d4ff3a; }
  .sticker { position: absolute; right: 80px; top: 150px; width: 230px; height: 230px; border-radius: 50%; background: #d4ff3a; color: #0b0b0c; border: 4px solid #0b0b0c; box-shadow: 8px 8px 0 #000; transform: rotate(10deg); display: grid; place-items: center; text-align: center; font-weight: 900; text-transform: uppercase; font-size: 30px; line-height: 1; }
  .sticker b { display: block; font-size: 66px; letter-spacing: -.04em; }
  #icon { width: 180px; height: 180px; }
</style>
</head>
<body>
<div id="og">
  <div class="eyebrow">Aus Salzgitter · für ganz Deutschland</div>
  <h1>Dein Laden.<br><span class="hl">Online.</span></h1>
  <div class="sub">Webseiten für kleine Läden. Feste Preise ab 149 €.</div>
  <div class="sticker"><span><b>0 €</b>Vorschau</span></div>
  <div class="spacer"></div>
  <div class="foot">
    <span class="logo"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#d4ff3a"/><path d="M22 38h56v36a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z" fill="#0b0b0c"/><path d="M18 38l8-16h48l8 16z" fill="#0b0b0c"/><rect x="42" y="56" width="16" height="24" rx="2" fill="#d4ff3a"/></svg>Webdesign Salzgitter</span>
    <span class="url">salzgitter-webdesign.de</span>
  </div>
</div>
<br>
<svg id="icon" viewBox="0 0 100 100"><rect width="100" height="100" fill="#d4ff3a"/><path d="M24 40h52v32a5 5 0 0 1-5 5H29a5 5 0 0 1-5-5z" fill="#0b0b0c"/><path d="M20 40l7-15h46l7 15z" fill="#0b0b0c"/><rect x="43" y="56" width="14" height="21" rx="2" fill="#d4ff3a"/></svg>
</body>
</html>
